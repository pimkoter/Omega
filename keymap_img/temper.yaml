layout: {zmk_keyboard: temper}
layers:
  NORMAL:
  - - Q
    - W
    - F
    - P
    - B
    - J
    - L
    - U
    - Y
    - {t: ;, s: ':'}
  - - A
    - {t: R, h: ⎇}
    - {t: S, h: ⌘}
    - {t: T, h: ⌃}
    - G
    - M
    - {t: N, h: ⌃}
    - {t: E, h: ⌘}
    - {t: I, h: ⎇}
    - O
  - - Z
    - X
    - C
    - D
    - V
    - K
    - H
    - {t: ',', s: <}
    - {t: ., s: '>'}
    - /
  - - {t: LSHIFT, h: sticky}
    - BACKSPACE
    - {t: ONESHOT, h: Gui+Sft+Alt+⌃}
    - ENTER
    - {t: SPACE, h: Sft+Alt+⌃}
    - '&key_repeat'
  ONESHOT:
  - - '!'
    - '@'
    - '#'
    - $
    - '%'
    - ^
    - '&'
    - '*'
    - '~'
    - {t: '=', s: +}
  - - ESC
    - (
    - )
    - '{'
    - '}'
    - +
    - {t: NAV, h: toggle}
    - {t: NUM, h: toggle}
    - _
    - {t: '`', s: '~'}
  - - ↹
    - '['
    - ']'
    - <
    - '>'
    - \
    - '|'
    - {t: '''', s: '"'}
    - '"'
    - '?'
  - - {t: LSHIFT, h: sticky}
    - BACKSPACE
    - {t: NAV, h: Gui+Sft+Alt+⌃}
    - {t: NORMAL, h: toggle}
    - {t: SPACE, h: Sft+Alt+⌃}
    - '&key_repeat'
  NAV:
  - - {t: '`', s: '~'}
    - '&msc SCRL_LEFT'
    - '&mmv MOVE_UP'
    - '&msc SCRL_RIGHT'
    - ⌘Q
    - BACK
    - ⌃⇧↹
    - ⌃↹
    - FORWARD
    - BACKSPACE
  - [ESC, '&mmv MOVE_LEFT', '&mmv MOVE_DOWN', '&mmv MOVE_RIGHT', DELETE, ←, ↓, ↑, →, ENTER]
  - [↹, '&mkp RCLK', '&msc SCRL_UP', '&msc SCRL_DOWN', '&', '&mkp LCLK', '&mmv MOVE_X(300)', '&mmv MOVE_X(600)', '&mmv MOVE_X(1200)', '&']
  - - {t: LSHIFT, h: sticky}
    - BACKSPACE
    - {t: NUM, h: Gui+Sft+Alt+⌃}
    - {t: NORMAL, h: toggle}
    - {t: SPACE, h: Sft+Alt+⌃}
    - '&key_repeat'
  NUM:
  - ['&', PP, PREV, NEXT, '&', '7', '8', '9', BACKSPACE, NONE]
  - - ESC
    - '&'
    - VOL DN
    - VOL UP
    - '&'
    - {t: '=', s: +}
    - '4'
    - '5'
    - '6'
    - ENTER
  - [↹, '&', BRI DN, BRI UP, '&', '0', '1', '2', '3', '&']
  - - {t: LSHIFT, h: sticky}
    - BACKSPACE
    - {t: NORMAL, h: Gui+Sft+Alt+⌃}
    - {t: NORMAL, h: toggle}
    - {t: SPACE, h: Sft+Alt+⌃}
    - '&key_repeat'
